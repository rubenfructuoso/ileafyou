<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>i leaf you</title>
<meta name="description" content="Pflanzen pflegen, Level sammeln.">
<meta name="theme-color" content="#F2F4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18231A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="i leaf you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gluten:wght@400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-build="pwa">
<main>
  <header class="top">
    <h1 class="logo" aria-label="i leaf you"><span id="logoMark" aria-hidden="true"></span><span class="wordmark" aria-hidden="true">i leaf you</span></h1>
    <div class="date" id="date"></div>
  </header>
  <div id="app"></div>
</main>

<button class="fab" data-action="new" data-i18n="fab">+ Pflanze</button>

<dialog id="formDlg">
  <form class="sheet" id="form" method="dialog">
    <div class="sheethead"><h2 id="formTitle"></h2><button type="button" class="x" data-action="close" data-i18n-aria="close">×</button></div>
    <label for="photoIn" class="photo" id="photoBox"></label>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
    <label data-i18n="f_icon"></label>
    <div class="iconpick" id="iconPick"></div>
    <label for="fName" data-i18n="f_name"></label>
    <input id="fName" required data-i18n-ph="f_namePh">
    <label for="fSpecies" data-i18n="f_species"></label>
    <input id="fSpecies" data-i18n-ph="f_speciesPh">
    <button type="button" class="linkbtn" id="identifyBtn" data-i18n="f_identify" hidden></button>
    <div class="chips idres" id="idResults"></div>
    <div class="row">
      <div><label for="fSite" data-i18n="f_site"></label><select id="fSite"></select></div>
      <div><label for="fLoc" data-i18n="f_place"></label><input id="fLoc" data-i18n-ph="f_placePh"></div>
    </div>
    <div class="row">
      <div><label for="fWater" data-i18n="f_water"></label><input id="fWater" type="number" min="0" inputmode="numeric" value="7"></div>
      <div><label for="fFeed" data-i18n="f_feed"></label><input id="fFeed" type="number" min="0" inputmode="numeric" value="30"></div>
    </div>
    <div class="hint" data-i18n="f_zero"></div>
    <label for="fNotes" data-i18n="f_notes"></label>
    <textarea id="fNotes" data-i18n-ph="f_notesPh"></textarea>
    <button class="primary" type="submit" data-i18n="f_save"></button>
    <button class="ghost" type="button" id="formDelete" data-i18n="f_delete" hidden></button>
  </form>
</dialog>

<dialog id="detailDlg"><input type="file" id="diaryIn" accept="image/*" capture="environment" hidden><div class="sheet" id="detail"></div></dialog>
<dialog id="celDlg"><div class="celebrate" id="cel"></div></dialog>
<dialog id="askDlg"><div class="celebrate"><h2 id="askTxt" style="font-size:1.35rem"></h2><button class="primary" id="askOk"></button><button class="ghost" data-action="close" style="color:var(--muted)" data-i18n="cancel"></button></div></dialog>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" data-i18n="undo" hidden></button></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
